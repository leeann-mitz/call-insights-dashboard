name: Notify Slack on Call Insights Update

on:
  push:
    branches: [main]
    paths:
      - 'data/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"Call Insights Dashboard updated\"}" "$SLACK_WEBHOOK_URL"